const RG=()=>S.regions[S.region];

const SD=id=>SITEDEF[id];
function findSite(id){const d=SD(id);return S.regions[d.ri].sites[d.k]}
function boostMult(){return (now()<S.boostUntil?2:1)*(now()<S.msUntil?2:1)}
function plMult(){return 1+S.plEarned*0.1}
function baseMult(){return TIERS[S.tier].m*plMult()*(S.throne?2:1)}
function mult(){return baseMult()*boostMult()}
function lvMult(lv){return lv*Math.pow(2,Math.floor(lv/25))}
function manVal(s,fx){if(!s.man)return 0;const m=MAN(s.man);if(!m||m.fx!==fx)return 0;const lv=(S.men[m.id]||{lv:1}).lv;return m.v*(1+.5*(lv-1))}
function unitRent(s,m){return SD(s.id).rent*lvMult(s.lv)*(m==null?mult():m)*(1+manVal(s,"rent"))}
function feeOf(s){return unitRent(s)*SD(s.id).fill*.4*(1+manVal(s,"fee"))}
function targetUnits(s){const d=SD(s.id);return d.base+d.grow.filter(g=>s.lv>=g).length*2}
function stage(s){return Math.min(4,SD(s.id).grow.filter(g=>s.lv>=g).length)}
const tankSize=()=>3+S.tank;
const truckSpeed=()=>78*(1+S.speed*0.12)*(1+.1*(S.perm.speed||0));
const serviceTime=s=>0.8/(1+S.wash*0.2)/(1+(s?manVal(s,"speed"):0));
const dumpTime=()=>2.2/(1+S.dump*0.25);
const maxTrucks=()=>2+S.cap;
let heatUntil=0;
const stinkMul=s=>(now()<heatUntil?2:1)/(1+manVal(s,"stink"))/(1+.1*(S.perm.stink||0));
const bossActive=()=>now()<RG().bossUntil;
const siteActive=s=>s.open&&(!SD(s.id).boss||bossActive());
function rentRate(){let r=0;for(const s of RG().sites)if(siteActive(s))r+=unitRent(s)*s.units.filter(u=>u<1).length;return r}
function regionIdeal(ri,m){let r=0;for(const s of S.regions[ri].sites)if(s.open&&!SD(s.id).boss)r+=unitRent(s,m)*s.units.length;return r}
function idealRate(){return regionIdeal(S.region)}
function franchiseRate(){let r=0;S.regions.forEach((g,i)=>{if(i===S.region||!g.open)return;for(const s of g.sites)if(s.open&&s.mgr&&!SD(s.id).boss)r+=unitRent(s,baseMult())*s.units.length*.2*(1+manVal(s,"offline"))});return r}
function fixUnits(){for(const g of S.regions)for(const s of g.sites){const tu=targetUnits(s);while(s.units.length<tu)s.units.push(0);if(s.units.length>tu&&!SD(s.id).boss)s.units.length=tu}}

function pine(c,x,y,s=1,snow){c.save();c.translate(x,y);c.scale(s,s);shadow(c,2,10,9,3);rr(c,-1.5,4,3,6,1);fs(c,"#7a4a22",1.2);for(let j=0;j<3;j++){poly(c,[0,-14+j*6,-8+j*-1,-2+j*6,8-j*-1,-2+j*6]);fs(c,"#1f7a4a",1.3)}if(snow){c.fillStyle="#fff";poly(c,[0,-14,-3.5,-9,3.5,-9]);c.fill()}c.restore()}
function cactus(c,x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);shadow(c,1,10,7,2.5);rr(c,-3,-12,6,22,3);fs(c,"#3fa34d",1.4);rr(c,-9,-5,5,9,2.5);fs(c,"#3fa34d",1.3);rr(c,4,-9,5,8,2.5);fs(c,"#3fa34d",1.3);c.restore()}
function rock(c,x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);ell(c,0,0,8,5);fs(c,"#a8a29e",1.3);c.fillStyle="#d6d3d1";ell(c,-2,-2,3,1.5);c.fill();c.restore()}
function tent(c,x,y,col,s=1){c.save();c.translate(x,y);c.scale(s,s);shadow(c,0,8,13,3);poly(c,[0,-14,-13,8,13,8]);fs(c,col);c.fillStyle="#fff8";poly(c,[0,-14,-4,8,4,8]);c.fill();poly(c,[0,-2,-3,8,3,8]);fs(c,"#1d2433",1);c.restore()}
function house(c,x,y,col,scaf,s=1){c.save();c.translate(x,y);c.scale(s,s);shadow(c,0,10,16,3);rr(c,-12,-6,24,16,1);fs(c,col);poly(c,[-15,-6,0,-18,15,-6]);fs(c,"#c2410c");rr(c,-8,-2,6,5,1);fs(c,"#bfe7ff",1.1);rr(c,3,1,6,9,1);fs(c,"#7c4a1e",1.1);
 if(scaf){c.strokeStyle="#b07a3c";c.lineWidth=1.4;for(const sx of[-16,16]){c.beginPath();c.moveTo(sx,10);c.lineTo(sx,-14);c.stroke()}c.beginPath();c.moveTo(-16,-2);c.lineTo(16,-2);c.moveTo(-16,5);c.lineTo(16,5);c.stroke()}c.restore()}
function building(c,x,y,w,h,col,t,lit){c.save();c.translate(x,y);shadow(c,0,2,w*.6,3);rr(c,-w/2,-h,w,h,2);fs(c,col);c.fillStyle=lit?"#fde68a":"#bfe7ff";for(let yy=-h+4;yy<-3;yy+=7)for(let xx=-w/2+3;xx<w/2-3;xx+=6){c.fillRect(xx,yy,3.5,4)}c.restore()}
function crane(c,x,y,h,t){c.save();c.translate(x,y);c.strokeStyle="#eab308";c.lineWidth=2.4;c.beginPath();c.moveTo(0,0);c.lineTo(0,-h);c.lineTo(26,-h);c.moveTo(-8,-h);c.lineTo(0,-h);c.stroke();c.strokeStyle=INK;c.lineWidth=.8;const hx=10+Math.sin(t/1500)*10;c.beginPath();c.moveTo(hx,-h);c.lineTo(hx,-h+12+Math.sin(t/700)*3);c.stroke();rr(c,hx-3,-h+12+Math.sin(t/700)*3,6,4,1);fs(c,"#f97316",1);c.restore()}
function cone(c,x,y){poly(c,[x,y-7,x-3.5,y+2,x+3.5,y+2]);fs(c,"#f97316",1.1);c.fillStyle="#fff";c.fillRect(x-2,y-3,4,1.4)}
function stall(c,x,y,col){c.save();c.translate(x,y);rr(c,-11,-2,22,9,1);fs(c,"#d6a26b",1.3);for(let k=0;k<4;k++){c.beginPath();c.moveTo(-12+k*6,-10);c.lineTo(-6+k*6,-10);c.lineTo(-6+k*6,-4);c.quadraticCurveTo(-9+k*6,-1,-12+k*6,-4);c.closePath();fs(c,k%2?"#fff":col,1.1)}c.fillStyle="#ef4444";circ(c,-5,-1,2);c.fill();c.fillStyle="#22c55e";circ(c,0,-1,2);c.fill();c.fillStyle="#f59e0b";circ(c,5,-1,2);c.fill();c.restore()}
function foodtruck(c,x,y,col,t){c.save();c.translate(x,y);shadow(c,0,8,15,3);rr(c,-14,-11,28,17,3);fs(c,col);rr(c,-9,-7,13,7,1);fs(c,"#1d2433",1);c.fillStyle="#fde68a";c.fillRect(-8,-6,11,2);poly(c,[-11,-9,7,-9,9,-14,-13,-14]);fs(c,"#fff",1.1);for(const wx of[-8,8]){circ(c,wx,6,3);fs(c,"#222",1.1)}c.restore()}
function stageProp(c,x,y,w,col,t){c.save();c.translate(x,y);shadow(c,0,6,w*.55,3);rr(c,-w/2,-4,w,10,2);fs(c,"#4b5563");rr(c,-w/2+2,-24,w-4,20,2);fs(c,col);for(let k=0;k<5;k++){const on=Math.sin(t/200+k*1.7)>0;c.fillStyle=on?["#f43f5e","#facc15","#22d3ee","#a3e635","#e879f9"][k]:"#334155";circ(c,-w/2+6+k*(w-12)/4,-21,2);c.fill()}rr(c,-w/2-4,-14,5,18,1);fs(c,"#111827",1.1);rr(c,w/2-1,-14,5,18,1);fs(c,"#111827",1.1);c.restore()}
function ferris(c,x,y,r,t){c.save();c.translate(x,y);c.strokeStyle=INK;c.lineWidth=1.6;c.beginPath();c.moveTo(-r*.6,r+6);c.lineTo(0,0);c.lineTo(r*.6,r+6);c.stroke();circ(c,0,0,r);c.lineWidth=2;c.strokeStyle="#ec4899";c.stroke();const a0=t/1600;c.lineWidth=.8;c.strokeStyle="#475569";for(let k=0;k<8;k++){const a=a0+k*Math.PI/4;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.stroke()}for(let k=0;k<8;k++){const a=a0+k*Math.PI/4;rr(c,Math.cos(a)*r-2.5,Math.sin(a)*r-1,5,5,1.5);fs(c,SHIRTS[k],1)}circ(c,0,0,2.2);fs(c,"#facc15",1);c.restore()}
function stadium(c,x,y,w,h,t,snow){c.save();c.translate(x,y);shadow(c,2,h*.55,w*.55,5);ell(c,0,0,w/2,h/2);fs(c,snow?"#cbd5e1":"#94a3b8",2);ell(c,0,0,w/2-6,h/2-5);fs(c,"#475569",1.2);
 for(let k=0;k<60;k++){const a=k/60*Math.PI*2;const rx=(w/2-3.5)*Math.cos(a),ry=(h/2-2.8)*Math.sin(a);c.fillStyle=SHIRTS[(k+Math.floor(t/400))%8];c.fillRect(rx-1,ry-1,2,2)}
 ell(c,0,0,w/2-12,h/2-10);fs(c,snow?"#e0f2fe":"#22c55e",1.2);c.strokeStyle="#fff";c.lineWidth=.8;c.beginPath();c.moveTo(0,-h/2+10);c.lineTo(0,h/2-10);c.stroke();circ(c,0,0,4);c.stroke();c.restore()}
function balloon(c,x,y,col,t){const bx=x+Math.sin(t/500+x)*1.5,by=y+Math.sin(t/400+x)*2;c.strokeStyle=INK;c.lineWidth=.7;c.beginPath();c.moveTo(bx,by+5);c.lineTo(x,y+16);c.stroke();ell(c,bx,by,4,5);fs(c,col,1.1);c.fillStyle="#fff9";circ(c,bx-1.3,by-1.8,1.1);c.fill()}
function grill(c,x,y,t){rr(c,x-6,y-4,12,6,3);fs(c,"#374151",1.2);c.strokeStyle=INK;c.lineWidth=1;c.beginPath();c.moveTo(x-4,y+2);c.lineTo(x-5,y+8);c.moveTo(x+4,y+2);c.lineTo(x+5,y+8);c.stroke();c.fillStyle="#9ca3af88";circ(c,x+Math.sin(t/300)*2,y-8-((t/40)%8),2.2);c.fill()}
function flag(c,x,y,col,t){c.strokeStyle=INK;c.lineWidth=1.3;c.beginPath();c.moveTo(x,y);c.lineTo(x,y-20);c.stroke();c.beginPath();c.moveTo(x,y-20);c.quadraticCurveTo(x+6,y-20+Math.sin(t/150)*2,x+11,y-17);c.lineTo(x,y-13);c.closePath();fs(c,col,1)}
function snowman(c,x,y){circ(c,x,y,5);fs(c,"#fff",1.2);circ(c,x,y-7,3.5);fs(c,"#fff",1.2);c.fillStyle="#f97316";poly(c,[x,y-7,x+4,y-6.5,x,y-6]);c.fill()}
function lodge(c,x,y,st,t){c.save();c.translate(x,y);shadow(c,0,10,18,3);rr(c,-15,-6,30,16,1);fs(c,"#92400e");c.strokeStyle="#78350f";c.lineWidth=.8;for(let k=-2;k<10;k+=3){c.beginPath();c.moveTo(-15,k);c.lineTo(15,k);c.stroke()}poly(c,[-18,-6,0,-19,18,-6]);fs(c,"#fff");rr(c,-9,-2,6,5,1);fs(c,"#fde68a",1);rr(c,4,1,6,9,1);fs(c,"#451a03",1);rr(c,8,-20,4,8,0);fs(c,"#57534e",1);c.fillStyle="#d1d5db99";circ(c,10+Math.sin(t/300)*2,-24-((t/50)%8),2.4);c.fill();if(st<2){c.strokeStyle="#b07a3c";c.lineWidth=1.3;c.beginPath();c.moveTo(-18,10);c.lineTo(-18,-12);c.moveTo(18,10);c.lineTo(18,-12);c.stroke()}c.restore()}
function hill(c,x,y,w,h,t){c.save();c.translate(x,y);c.beginPath();c.moveTo(-w/2,0);c.quadraticCurveTo(0,-h*2,w/2,0);c.closePath();fs(c,"#fff",1.6);const p=(t/3000)%1;drawPerson(c,-w/2+p*w*.9,-h*(1-Math.abs(p-.5)*2)*.9+6,"#ef4444","#ffdbac",t,"stand");c.restore()}
function halfpipe(c,x,y,t){c.save();c.translate(x,y);c.beginPath();c.moveTo(-18,-12);c.quadraticCurveTo(-18,6,0,6);c.quadraticCurveTo(18,6,18,-12);c.lineTo(22,-12);c.lineTo(22,10);c.lineTo(-22,10);c.lineTo(-22,-12);c.closePath();fs(c,"#bae6fd",1.5);const a=Math.sin(t/500);drawPerson(c,a*14,-2-Math.abs(a)*10,"#22c55e","#c68642",t,"stand");c.restore()}
function iceSculpt(c,x,y,t,s=1){c.save();c.translate(x,y);c.scale(s,s);shadow(c,0,8,9,2.5);c.globalAlpha=.85;c.beginPath();c.moveTo(-7,8);c.quadraticCurveTo(-10,-2,-2,-4);c.quadraticCurveTo(-4,-14,2,-16);c.quadraticCurveTo(6,-14,3,-10);c.quadraticCurveTo(10,-4,7,8);c.closePath();fs(c,"#a5f3fc",1.3);c.globalAlpha=1;if(Math.sin(t/300+x)>.85){c.fillStyle="#fff";c.font="6px sans-serif";c.fillText("✦",2,-8)}c.restore()}
function artPiece(c,x,y,t){c.save();c.translate(x,y);shadow(c,0,9,10,3);rr(c,-2,-4,4,13,1);fs(c,"#57534e",1.2);c.rotate(t/1200);for(let k=0;k<3;k++){c.rotate(Math.PI*2/3);poly(c,[0,-4,-4,-15,4,-15]);fs(c,["#f43f5e","#facc15","#22d3ee"][k],1.2)}c.restore()}
function fire(c,x,y,t){c.fillStyle="#7c2d12";c.fillRect(x-6,y+2,12,2.5);const f=Math.sin(t/80)*1.5;c.beginPath();c.moveTo(x-4,y+2);c.quadraticCurveTo(x-3,y-6-f,x,y-10-f);c.quadraticCurveTo(x+3,y-6,x+4,y+2);c.closePath();fs(c,"#f97316",1);c.fillStyle="#fde047";ell(c,x,y-1,1.6,3);c.fill()}
function dumpster(c,x,y){rr(c,x-9,y-6,18,11,1.5);fs(c,"#15803d",1.3);rr(c,x-10,y-8,20,3,1);fs(c,"#166534",1.1)}
function arch(c,x,y,col,txt){c.strokeStyle=INK;c.lineWidth=1.3;rr(c,x-20,y-22,4,24,1);fs(c,col,1.2);rr(c,x+16,y-22,4,24,1);fs(c,col,1.2);rr(c,x-22,y-28,44,9,2);fs(c,"#fff",1.3);c.fillStyle=INK;c.font="900 6px sans-serif";c.textAlign="center";c.fillText(txt,x,y-21.5)}
function bouncy(c,x,y,t){const sq=Math.sin(t/120)*.6;rr(c,x-12,y-10+sq,24,16,3);fs(c,"#f43f5e",1.3);for(const tx of[-12,12]){rr(c,x+tx-3,y-17,6,10,2);fs(c,"#facc15",1.2)}rr(c,x-6,y-4,12,8,2);fs(c,"#60a5fa",1.1)}
function lights(c,x1,x2,y,t){c.strokeStyle="#1d2433";c.lineWidth=.7;c.beginPath();c.moveTo(x1,y);c.quadraticCurveTo((x1+x2)/2,y+8,x2,y);c.stroke();for(let k=0;k<=8;k++){const p=k/8,xx=x1+(x2-x1)*p,yy=y+8*4*p*(1-p)*.5*2;c.fillStyle=Math.sin(t/250+k)>0?SHIRTS[k%8]:"#64748b";circ(c,xx,yy+1.5,1.5);c.fill()}}
// ================= SITE ART =================
function padSize(d){return d.boss?{w:176,h:88}:{w:140,h:80}}
function siteArt(c,s,d,st,t,active){const {w,h}=padSize(d);const L=d.x-w/2+15,R=d.x+w/2-15,T=d.y-h/2,B=d.y+h/2-14,cy=d.y;
 switch(d.art){
 case"party":balloon(c,L-2,T+6,"#f43f5e",t);if(st>=1)balloon(c,L+5,T+3,"#facc15",t+500);if(st>=3)balloon(c,R,T+5,"#a855f7",t+900);grill(c,L,B-2,t);if(st>=2)lights(c,d.x-w/2+6,d.x+w/2-6,T-2,t);if(st>=3)bouncy(c,R,B-4,t);else tent(c,R,B-6,"#38bdf8",.8);if(st>=4)stageProp(c,R,T+28,24,"#7c3aed",t);break;
 case"remodel":house(c,R-2,B-6,st>=2?"#fde68a":"#e5e7eb",st<2,.85);dumpster(c,L,B-2);if(st>=1)cone(c,L,T+20);if(st>=3)house(c,R-2,T+20,"#bbf7d0",false,.7);break;
 case"constr":{const hh=[10,26,40,52,62][st];if(st===0){c.fillStyle="#a16207";ell(c,L,B-2,10,5);c.fill();c.stroke()}else building(c,L,B+2,20,hh,st>=3?"#64748b":"#d97706",t,false);if(st>=1)crane(c,L+8,B+2,hh+16,t);cone(c,R,B-2);cone(c,R-6,B+2);if(st>=2)dumpster(c,R,T+22);break}
 case"market":for(let k=0;k<1+Math.min(st,2);k++)stall(c,k%2?R:L,B-4-Math.floor(k/2)*24,["#ef4444","#22c55e","#f59e0b"][k]);if(st>=1)tree(c,R,T+16,.6,t);break;
 case"fair":if(!active){ferris(c,d.x-40,d.y-6,22,t);tent(c,d.x+30,d.y+6,"#ef4444",1.2);tent(c,d.x+58,d.y+10,"#facc15",.9);flag(c,d.x+30,d.y-8,"#22c55e",t)}else{ferris(c,L,T+20,13,t);tent(c,R,T+22,"#ef4444",.9)}break;
 case"foodtrucks":foodtruck(c,L+2,B-6,"#f97316",t);if(st>=1)foodtruck(c,R-2,B-6,"#22c55e",t);if(st>=2)lights(c,d.x-w/2+6,d.x+w/2-6,T-2,t);if(st>=3)foodtruck(c,R-2,T+22,"#ec4899",t);break;
 case"tower":{const hh=[14,30,46,58,66][st];building(c,L,B+2,22,hh,"#60a5fa",t,st>=3);if(st<4)crane(c,L+9,B+2,hh+14,t);cone(c,R,B);break}
 case"marathon":arch(c,R,B+2,"#3b82f6","FINISH");for(let k=0;k<2+Math.min(st,3);k++){const p=((t/2600+k*.23)%1);drawPerson(c,d.x-w/2+8+p*(w-16),B+6,SHIRTS[k],SKINS[k%5],t,"walk",k)}break;
 case"concert":stageProp(c,L+4,B-2,30,"#7c3aed",t);if(st>=2)stageProp(c,R-2,T+26,22,"#0ea5e9",t);for(let k=0;k<3+st;k++)drawPerson(c,R-10+(k%3)*7,B-2+Math.floor(k/3)*0-((t/150+k)%2<1?1.5:0),SHIRTS[k%8],SKINS[k%5],t,"stand");break;
 case"stadium":if(!active){stadium(c,d.x-10,d.y,120,58,t)}else{stadium(c,L+2,T+22,30,20,t)}break;
 case"camp":tent(c,L,B-6,"#f97316",.9);if(st>=1)tent(c,R,B-6,"#22c55e",.9);fire(c,L+2,T+22,t);if(st>=2)tent(c,R,T+24,"#3b82f6",.8);cactus(c,R+4,T+4,.5);break;
 case"art":artPiece(c,L,B-4,t);if(st>=1)artPiece(c,R,T+22,t+700);if(st>=2)cactus(c,R,B-4,.6);break;
 case"stage":stageProp(c,L+4,B-2,30,"#e11d48",t);if(st>=2)lights(c,d.x-w/2+6,d.x+w/2-6,T-2,t);cactus(c,R,B-4,.6);break;
 case"bigstage":if(!active){stageProp(c,d.x,d.y+12,110,"#be123c",t);for(let k=0;k<4;k++){c.save();c.globalAlpha=.25;c.fillStyle=SHIRTS[k*2];c.beginPath();c.moveTo(d.x-40+k*26,d.y-10);c.lineTo(d.x-60+k*26+Math.sin(t/600+k)*30,d.y-44);c.lineTo(d.x-46+k*26+Math.sin(t/600+k)*30,d.y-44);c.fill();c.restore()}}else stageProp(c,L+4,T+28,26,"#be123c",t);break;
 case"lodge":lodge(c,R-2,B-4,st,t);pine(c,L,B-4,.8,true);if(st>=2)snowman(c,L,T+24);break;
 case"slope":hill(c,R-4,B+2,34,14,t);pine(c,L,B-4,.8,true);if(st>=2)pine(c,L,T+22,.7,true);break;
 case"halfpipe":halfpipe(c,R-6,B-2,t);pine(c,L,B-4,.8,true);break;
 case"ice":iceSculpt(c,L,B-4,t);if(st>=1)iceSculpt(c,R,B-4,t,.9);if(st>=3)iceSculpt(c,R,T+24,t,.7);break;
 case"arena":if(!active){stadium(c,d.x-10,d.y,120,58,t,true);fire(c,d.x+60,d.y-16,t)}else{stadium(c,L+2,T+22,30,20,t,true)}break;
 }}
function unitPos(s,i){const d=SD(s.id);const n=s.units.length;const {w}=padSize(d);
 if(d.boss){const cols=10,r=Math.floor(i/cols),c=i%cols;return{x:d.x+12-(cols-1)*6.4+c*12.8,y:d.y-14+r*16,k:.6}}
 const cols=n<=3?n:n<=8?4:5;const rows=Math.ceil(n/cols);const r=Math.floor(i/cols),c=i%cols;const rowN=Math.min(cols,n-r*cols);const sp=cols>=5?16.5:19;const k=rows>=3?.66:rows===2?.78:.9;const vy=rows>=3?19:22;
 return{x:d.x+2-(rowN-1)*sp/2+c*sp,y:d.y-2-(rows-1)*vy/2+r*vy,k}}

function drawYard(c,t){const X=YARD.x,Y=YARD.y;rr(c,X-56,Y-36,112,66,8);fs(c,REG().id==="snow"||REG().deco==="snow"?"#e2e8f0":"#c8ccd2",2);
 c.fillStyle="#9aa3ae";for(let i=0;i<9;i++)c.fillRect(X-54+i*13.5,Y+27,2,5);
 const tr=S.tier;c.save();c.translate(X-30,Y-4);
