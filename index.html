// ================= AUDIO =================
let AC=null,musGain=null,sfxGain=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();sfxGain=AC.createGain();sfxGain.gain.value=1;sfxGain.connect(AC.destination);musGain=AC.createGain();musGain.gain.value=.55;musGain.connect(AC.destination)}if(AC.state==="suspended")AC.resume();return AC}

let lastCoinSnd=0;
const sfx={
 coin:(p=0)=>{if(performance.now()-lastCoinSnd<45)return;lastCoinSnd=performance.now();const b=880*Math.pow(1.06,Math.min(p,12));tone(b,.05,"square",.03);tone(b*1.5,.09,"square",.03,0,.05)},
 buy:()=>{tone(523,.07);tone(659,.07,"square",.05,0,.06);tone(784,.12,"square",.05,0,.12)},

};

// --- procedural music: bouncy oom-pah tuba + chiptune lead ---
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SONG={bpm:118,
 chords:[[48,52,55],[53,57,60],[55,59,62],[48,52,55],[45,48,52],[53,57,60],[55,59,62],[55,59,62]],
 mel:[[72,0,76,0,79,0,76,74,72,0,0,0,67,0,69,71],[72,0,77,0,81,0,79,77,76,0,74,0,72,0,0,0],[74,0,79,0,77,0,74,0,71,0,74,0,79,0,77,76],[76,0,72,0,74,0,76,0,72,0,0,0,0,0,67,0],
      [69,0,72,0,76,0,72,0,69,0,71,0,72,0,74,0],[77,0,76,0,74,0,72,0,74,0,76,0,77,0,79,0],[79,0,0,81,79,0,77,0,76,0,74,0,72,0,71,0],[74,0,0,0,79,0,0,0,74,71,72,74,0,0,0,0]]};
let musStep=0,musNext=0,musTimer=null,noiseBuf=null;
function hat(t,v){const A=ac();if(!noiseBuf){noiseBuf=A.createBuffer(1,A.sampleRate*.05,A.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const s=A.createBufferSource();s.buffer=noiseBuf;const f=A.createBiquadFilter();f.type="highpass";f.frequency.value=7000;const g=A.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(f);f.connect(g);g.connect(musGain);s.start(t);s.stop(t+.05)}
function note(m,t,d,type,vol){const A=ac();const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=mtof(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+d+.02)}
function musicTick(){const A=ac();const sp=60/SONG.bpm/4;while(musNext<A.currentTime+.15){const bar=Math.floor(musStep/16)%8,st=musStep%16,ch=SONG.chords[bar],t=musNext;
  if(st%8===0)note(ch[0]-12,t,sp*3,"triangle",.22);if(st%8===4)note(ch[0]-5,t,sp*3,"triangle",.18);

  musStep++;musNext+=sp}}
function musicOn(on){try{if(on){ac();if(!musTimer){musNext=AC.currentTime+.05;musTimer=setInterval(musicTick,40)}}else if(musTimer){clearInterval(musTimer);musTimer=null}}catch(e){}}

// ================= ART (code-drawn vector sprites) =================
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function fs(c,fill,lw=1.6){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function shadow(c,x,y,rx,ry){c.fillStyle="#0000002a";ell(c,x,y,rx,ry);c.fill()}
function poly(c,pts){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath()}

function face(c,x,y,u,t,i,sc=1){c.save();c.translate(x,y);c.scale(sc,sc);c.lineWidth=1;c.strokeStyle=INK;
 if(u>=1){c.lineWidth=1.2;for(const ex of[-2.8,2.8]){c.beginPath();c.moveTo(ex-1.4,-1.4);c.lineTo(ex+1.4,1.4);c.moveTo(ex+1.4,-1.4);c.lineTo(ex-1.4,1.4);c.stroke()}c.fillStyle="#7a1f1f";ell(c,0,4,1.8,1.4+Math.sin(t/90)*.4);c.fill()}
 else{const blink=((t/1000+i*1.37)%4)<.12;const px=Math.sin(t/900+i)*.7;
  for(const ex of[-2.8,2.8]){if(blink){c.beginPath();c.moveTo(ex-1.8,0);c.lineTo(ex+1.8,0);c.stroke()}else{c.fillStyle="#fff";circ(c,ex,0,2.2);c.fill();c.stroke();c.fillStyle=INK;circ(c,ex+px,.3,1.05);c.fill()}}
  if(u>.6){c.beginPath();c.moveTo(-4.6,-3.6);c.lineTo(-1.4,-2.6);c.moveTo(4.6,-3.6);c.lineTo(1.4,-2.6);c.stroke()}
  c.beginPath();if(u<.5){c.arc(0,2.6,1.8,.2,Math.PI-.2)}else{c.moveTo(-2,4);c.quadraticCurveTo(-1,3,0,4);c.quadraticCurveTo(1,5,2,4)}c.stroke();
  if(u>.8){c.fillStyle="#7dd3fc";c.beginPath();c.moveTo(5.5,-3);c.quadraticCurveTo(7,0,5.5,1);c.quadraticCurveTo(4,0,5.5,-3);c.fill()}}
 c.restore()}
function drawPotty(c,x,y,u,k,t,i,tier){c.save();c.translate(x,y);c.scale(k,k);const full=u>=1;if(full)c.rotate(Math.sin(t/70+i)*.08);const col=potCol(tier);
 shadow(c,1,10,tier===4?16:10,3);
 if(tier<4){const w=tier===3?22:16;
  rr(c,-w/2,-14,w,24,3);fs(c,col.b);
  if(tier===0){c.fillStyle=col.d;for(const [a,b,r] of[[-5,6,1.6],[4,-6,1.2],[5,4,1.8],[-4,-9,1]]){circ(c,a,b,r);c.fill()}}
  rr(c,-w/2-2,-18,w+4,5,2);fs(c,col.d);
  if(tier>=2){rr(c,w/2-5,-23,3,5,1);fs(c,"#cbd5e1",1.2)}
  c.save();if(tier===0)c.rotate(-.05);rr(c,-w/2+2.5,-11.5,w-5,20,2);fs(c,col.l,1.3);c.restore();
  moon(c,0,-8.6,1.6,col.l);
  if(tier===3){c.fillStyle="#fff";circ(c,w/2-3.5,5,2.3);c.fill();c.strokeStyle="#2563eb";c.lineWidth=.8;c.stroke()}
  if(tier===2){c.fillStyle="#fff";c.font="5px sans-serif";c.textAlign="center";c.fillText("★",-w/2+4,7)}
  face(c,0,-1.5,u,t,i);
 }else{rr(c,-15,-13,30,21,4);fs(c,col.b);c.fillStyle=col.d;c.fillRect(-15,0,30,2.5);rr(c,-16.5,-16,33,4.5,2);fs(c,col.d);
  rr(c,-12,-10,9,15,1.5);fs(c,"#fff",1.1);rr(c,3,-10,9,15,1.5);fs(c,"#fff",1.1);c.fillStyle="#fbbf24";c.fillRect(-15,-13,30,1.5);
  circ(c,-9,9,2.6);fs(c,"#333",1);circ(c,9,9,2.6);fs(c,"#333",1);face(c,0,-3,u,t,i,.9);
  if(Math.sin(t/300+i)>.92){c.fillStyle="#fff";c.font="6px sans-serif";c.fillText("✦",10,-14)}}
 c.fillStyle="#0005";c.fillRect(-10,13,20,3.2);c.fillStyle=u<.5?"#34d058":u<.85?"#f5b400":"#ef4444";c.fillRect(-10,13,20*Math.min(1,u),3.2);
 if(u>.6){c.strokeStyle=`rgba(120,170,40,${Math.min(.9,(u-.5)*1.5)})`;c.lineWidth=1.4;for(let j=-1;j<=1;j++){c.beginPath();const ph=t/250+j+i;c.moveTo(j*5,-19);c.quadraticCurveTo(j*5+Math.sin(ph)*4,-24,j*5,-29);c.stroke()}}
 c.restore()}
const TANKC=["#b9a089","#f2f2f2","#e0f7f4","#ede9fe","#fde68a"];
function drawTruck(c,x,y,dir,tier,t,moving){c.save();c.translate(x,y);c.scale(dir,1);if(moving)c.translate(0,Math.sin(t/55)*.7);const col=TIERC[tier];
 shadow(c,0,8,15,3);
 const TK=truckSkin();if(TK.big)c.translate(0,-2.5);rr(c,-15,-10,20,14,6);fs(c,TK.tank||TANKC[tier]);if(TK.rainbow){["#ef4444","#f59e0b","#22c55e","#3b82f6"].forEach((k,j)=>{c.fillStyle=k;c.fillRect(-14,-6+j*1.6,18,1.6)})}else{c.fillStyle=TK.stripe||(tier===4?"#c9a227":col.b);c.fillRect(-14,-4,18,3)}
 if(tier===0){c.fillStyle="#8a4516";circ(c,-9,-6,1.3);c.fill();circ(c,0,0,1);c.fill()}

 $("#cn").onclick=closeModal;$("#y").onclick=()=>{const k={plungers:S.plungers+g,sold:S.sold+1,life:S.life,sfx:S.sfx,music:S.music,tut:99,started:true,legacy:S.legacy,best:S.best,loads:S.loads};S=Object.assign(fresh(),k);E=null;buildEnts();gotoArea(0);closeModal();sfx.fanfare();toast(`🪠 +${g} Golden Plungers! Cash bonus +${S.plungers*5}%`);save()}};
