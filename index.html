<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b6fd8">
<title>Potty Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚽</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f2a4a;font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:#1d2433;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#eaf3ff;position:relative}
#hud{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#1b6fd8,#1557ad);color:#fff;box-shadow:0 2px 6px #0004;z-index:2}
#cash{font-size:24px;font-weight:900;text-shadow:0 2px 0 #0a3a7a;letter-spacing:.5px}
#rate{font-size:12px;opacity:.9}
#hud .sp{flex:1}
.ib{background:#ffffff26;border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:10px;cursor:pointer}
#boostbar{display:flex;gap:6px;padding:6px 10px;background:#d6e7ff;align-items:center;font-size:12px}
#boostbtn{flex:1;border:0;border-radius:10px;padding:8px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(#ff9d2e,#f07800);box-shadow:0 3px 0 #b85a00;cursor:pointer}
#boostbtn:disabled{background:#9fb0c8;box-shadow:0 3px 0 #7a8aa3}
#plg{font-weight:800;color:#a67c00;white-space:nowrap}
#mapwrap{position:relative;flex:0 0 auto}
canvas{display:block;width:100%;touch-action:manipulation}
#banner{position:absolute;left:8px;right:8px;top:8px;background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;box-shadow:0 3px 10px #0003;display:none;align-items:center;gap:8px}
#banner button{margin-left:auto}
#tabs{display:flex;background:#1d2433}
#tabs button{flex:1;border:0;background:none;color:#9fb3cf;padding:9px 0;font-size:12px;font-weight:800;cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#ffb020}
#panel{flex:1;overflow-y:auto;padding:8px 8px 20px;-webkit-overflow-scrolling:touch}
.card{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:7px;box-shadow:0 2px 0 #c7d6ea}
.card .ic{font-size:28px;width:38px;text-align:center}
.card .tx{flex:1;min-width:0}
.card .t{font-weight:800;font-size:14px}
.card .d{font-size:12px;color:#5a6780;margin-top:2px}
.buy{border:0;border-radius:10px;min-width:84px;padding:9px 8px;font-weight:900;font-size:13px;color:#fff;background:linear-gradient(#35c25a,#1f9a40);box-shadow:0 3px 0 #13702c;cursor:pointer}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #13702c}
.buy:disabled{background:#b9c4d4;box-shadow:0 3px 0 #96a3b6;color:#eef}
.buy.max{background:#8a6cf0;box-shadow:0 3px 0 #5b43b5}
.modal{position:absolute;inset:0;background:#0b1a33cc;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.box{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px #0006;animation:pop .25s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.box h2{margin:4px 0 8px;font-size:22px}
.box p{margin:6px 0;color:#435069;font-size:14px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(#35c25a,#1f9a40);box-shadow:0 4px 0 #13702c;margin-top:10px;cursor:pointer}
.big.alt{background:linear-gradient(#7d8ca6,#5b6a84);box-shadow:0 4px 0 #3c4860}
.big.red{background:linear-gradient(#ff5a5a,#d42c2c);box-shadow:0 4px 0 #8f1b1b}
.big:active{transform:translateY(2px)}
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#4fa3ff,#1557ad 60%,#0b2f63);color:#fff;text-align:center;padding:24px}
#title .logo{font-size:54px;font-weight:900;line-height:.95;letter-spacing:2px;text-shadow:0 5px 0 #0a3a7a,0 8px 18px #0008;transform:rotate(-4deg)}
#title .logo span{color:#ffd23f}
#title .em{font-size:84px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
#title .tag{margin:14px 0 26px;font-size:16px;opacity:.9}
#title .big{max-width:260px;font-size:22px}
.mini{font-size:56px;font-weight:900;margin:6px 0}
.tbar{height:10px;background:#e3e9f3;border-radius:6px;overflow:hidden;margin:8px 0}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9d2e,#ff4d4d);width:100%}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:25;white-space:nowrap}
.sec{font-size:11px;font-weight:900;color:#6c7a93;margin:8px 4px 5px;letter-spacing:1px}
</style></head>
<body><div id="app">
<div id="hud"><div><div id="cash">$0</div><div id="rate">$0/s</div></div><div class="sp"></div>
<button class="ib" id="sndbtn" title="Sound">🔊</button><button class="ib" id="setbtn" title="Settings">⚙️</button></div>
<div id="boostbar"><button id="boostbtn">📺 Watch ad: 2x cash 60s <small>(Demo boost)</small></button><span id="plg"></span></div>
<div id="mapwrap"><canvas id="cv"></canvas><div id="banner"></div></div>
<div id="tabs"><button data-t="units" class="on">🚽 Units</button><button data-t="trucks">🚛 Trucks</button><button data-t="crew">🧑‍🔧 Crew</button><button data-t="yard">🏗️ Yard</button><button data-t="prestige">🪠 Sell</button></div>
<div id="panel"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="title"><div class="em">🚽</div><div class="logo">POTTY<br><span>TYCOON</span></div><div class="tag">Build the #1 porta-potty empire in the county.<br>It's a dirty job. Somebody's gotta get rich doing it.</div><button class="big" id="playbtn">▶ PLAY</button></div>
</div>
<script>
"use strict";
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc"];
function fmt(n){if(n<1000)return (n<10&&n%1?n.toFixed(1):Math.floor(n)).toString();let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+SUF[i]}
const money=n=>"$"+fmt(n);
const rnd=(a,b)=>a+Math.random()*(b-a);
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`}

// ---------- data ----------
const W=400,H=400;
const YARD={x:62,y:338};
const SITES=[
 {id:"party",name:"Backyard Party",em:"🎉",x:300,y:330,cost:0,units:2,rent:1,fee:5,fill:22,col:"#9be37a"},
 {id:"remodel",name:"Home Remodel",em:"🏠",x:318,y:196,cost:120,units:3,rent:2.5,fee:12,fill:26,col:"#c9e6a5"},
 {id:"constr",name:"Construction Site",em:"🏗️",x:100,y:168,cost:900,units:4,rent:7,fee:35,fill:30,col:"#e8d3a6"},
 {id:"fair",name:"County Fair",em:"🎡",x:262,y:62,cost:6000,units:30,rent:30,fee:120,fill:16,col:"#ffd6e8"}
];
const STAGES=[{n:"Foundation",u:4,need:0},{n:"Framing",u:7,need:25},{n:"Building",u:10,need:80}];
const TIERS=[{n:"Basic",m:1,c:0,em:"🚽"},{n:"Deluxe",m:2.5,c:250,em:"🧼"},{n:"ADA Accessible",m:6,c:4000,em:"♿"},{n:"Luxury Trailer",m:16,c:60000,em:"✨"}];
const FAIR_LEN=120,FAIR_CD=150;

let S; // state
function fresh(){return{cash:0,total:0,plungers:0,tier:0,tank:0,speed:0,wash:0,dump:0,cap:0,trucks:1,
 sites:SITES.map(s=>({id:s.id,open:s.id==="party",mgr:false,units:Array.from({length:s.units},()=>Math.random()*.3),done:0,stage:0,angryT:0})),
 fairUntil:0,fairReady:0,boostUntil:0,boostCD:0,sound:true,last:Date.now(),started:false,sold:0}}

function load(){try{const d=JSON.parse(localStorage.getItem("pottyTycoon_v1"));if(d&&d.sites){const f=fresh();S=Object.assign(f,d);return true}}catch(e){}S=fresh();return false}
function save(){S.last=Date.now();try{localStorage.setItem("pottyTycoon_v1",JSON.stringify(S))}catch(e){}}

// ---------- derived ----------
const site=id=>S.sites.find(s=>s.id===id);
const def=id=>SITES.find(s=>s.id===id);
const now=()=>Date.now();
function mult(){return TIERS[S.tier].m*(1+S.plungers*0.1)*(now()<S.boostUntil?2:1)}
const tankSize=()=>3+S.tank*2;
const truckSpeed=()=>70*(1+S.speed*0.18);
const serviceTime=()=>0.9/(1+S.wash*0.35);
const dumpTime=()=>2.5/(1+S.dump*0.4);
const maxTrucks=()=>2+S.cap;
let heatUntil=0;
const stinkMul=()=>now()<heatUntil?2:1;
function fairActive(){return now()<S.fairUntil}
function siteActive(s){return s.open&&(s.id!=="fair"||fairActive())}
function unitCount(s){return s.id==="constr"?STAGES[s.stage].u:def(s.id).units}

// ---------- costs ----------
const C={
 tank:()=>Math.floor(60*Math.pow(1.85,S.tank)),
 speed:()=>Math.floor(45*Math.pow(1.75,S.speed)),
 truck:()=>Math.floor(300*Math.pow(3.2,S.trucks-1)),
 wash:()=>Math.floor(400*Math.pow(2.1,S.wash)),
 dump:()=>Math.floor(350*Math.pow(2.0,S.dump)),
 cap:()=>Math.floor(1500*Math.pow(4,S.cap)),
 mgr:id=>({party:25,remodel:400,constr:3000,fair:25000})[id],
 tier:()=>TIERS[S.tier+1]?TIERS[S.tier+1].c:Infinity
};
function spend(c){if(S.cash>=c){S.cash-=c;return true}return false}

// ---------- audio ----------
let AC=null;
function tone(f,d=.08,type="square",vol=.06,slide=0){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={
 coin:()=>{tone(988,.06,"square",.04);setTimeout(()=>tone(1319,.1,"square",.04),55)},
 buy:()=>{tone(523,.07);setTimeout(()=>tone(659,.07),60);setTimeout(()=>tone(784,.12),120)},
 flush:()=>tone(600,.35,"sawtooth",.04,-480),
 bad:()=>tone(180,.25,"sawtooth",.05,-80),
 tap:()=>tone(700,.04,"triangle",.06),
 horn:()=>{tone(392,.12,"square",.05);setTimeout(()=>tone(392,.18,"square",.05),150)},
 fanfare:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.15,"triangle",.07),i*110))
};

// ---------- trucks (runtime) ----------
let trucks=[];
function syncTrucks(){while(trucks.length<S.trucks)trucks.push({x:YARD.x,y:YARD.y,st:"idle",path:[],target:null,load:0,t:0,dir:1,hue:trucks.length});}
function pathTo(s){const d=def(s.id);return[{x:YARD.x,y:YARD.y},{x:YARD.x,y:d.y+22},{x:d.x,y:d.y+22}]}
function dispatch(tr,s){tr.target=s.id;tr.st="go";tr.path=pathTo(s).slice(1);}
function goHome(tr){const d=def(tr.target);tr.st="home";tr.path=[{x:YARD.x,y:d.y+22},{x:YARD.x,y:YARD.y}];}
function enRoute(id){return trucks.some(t=>t.target===id&&(t.st==="go"||t.st==="svc"))}
function dirtiest(s){let b=-1,v=.12;s.units.forEach((u,i)=>{if(u>v){v=u;b=i}});return b}

// ---------- floats & particles ----------
let floats=[],parts=[];
function float(x,y,txt,col="#1f9a40"){floats.push({x,y,txt,col,t:0})}

// ---------- earn ----------
let earnLog=[];
function earn(n,x,y){S.cash+=n;S.total+=n;earnLog.push([now(),n]);if(x!=null)float(x,y,"+"+money(n))}

function serviceUnit(s,i,x,y,manual){const d=def(s.id);const full=s.units[i]>=1;let pay=d.fee*mult()*(full?.5:1)*(manual?.6:1);if(s.id==="fair")pay*=1;s.units[i]=0;s.done++;earn(pay,x,y-10);sfx.coin();
 if(s.id==="constr"){const ns=STAGES[s.stage+1];if(ns&&s.done>=ns.need){s.stage++;while(s.units.length<ns.u)s.units.push(0);toast(`🏗️ Construction reached ${ns.n}! Now ${ns.u} units.`);sfx.fanfare();}}}

// ---------- update ----------
let last=performance.now(),acc=0,uiT=0,saveT=0,evT=rnd(70,110);
function update(dt){
 const sm=stinkMul();
 for(const s of S.sites){if(!siteActive(s))continue;const d=def(s.id);let anyFull=false;
  for(let i=0;i<s.units.length;i++){s.units[i]=Math.min(1,s.units[i]+dt/d.fill*sm);if(s.units[i]<1){S.cash+=d.rent*mult()*dt;S.total+=d.rent*mult()*dt;earnLog.push([now(),d.rent*mult()*dt])}else{anyFull=true;S.cash+=d.rent*mult()*dt*.15;}}
  s.angry=anyFull;}
 // manager auto-dispatch
 for(const tr of trucks){if(tr.st!=="idle")continue;let best=null,bv=0;
  for(const s of S.sites){if(!s.mgr||!siteActive(s)||enRoute(s.id))continue;const v=s.units.reduce((a,u)=>a+(u>.45?u:0),0);if(v>bv){bv=v;best=s}}
  if(best)dispatch(tr,best);}
 const sp=truckSpeed();
 for(const tr of trucks){
  if(tr.st==="go"||tr.st==="home"){let mv=sp*dt;while(mv>0&&tr.path.length){const p=tr.path[0],dx=p.x-tr.x,dy=p.y-tr.y,L=Math.hypot(dx,dy);if(dx)tr.dir=dx>0?1:-1;if(L<=mv){tr.x=p.x;tr.y=p.y;tr.path.shift();mv-=L}else{tr.x+=dx/L*mv;tr.y+=dy/L*mv;mv=0}}
   if(!tr.path.length){if(tr.st==="go"){tr.st="svc";tr.t=0}else{tr.st=tr.load>0?"dump":"idle";tr.t=0;tr.target=null}}}
  else if(tr.st==="svc"){const s=site(tr.target);if(!siteActive(s)){goHome(tr);continue}tr.t+=dt;if(tr.t>=serviceTime()){tr.t=0;const i=dirtiest(s);if(i<0||tr.load>=tankSize()){goHome(tr)}else{const p=unitPos(s,i);serviceUnit(s,i,p.x,p.y);tr.load++;sparkle(p.x,p.y);if(tr.load>=tankSize())goHome(tr)}}}
  else if(tr.st==="dump"){tr.t+=dt;if(tr.t>=dumpTime()){tr.load=0;tr.st="idle";tr.t=0;sfx.flush()}}
 }
 for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.2);
 for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.t<.6);
 // events
 evT-=dt;if(evT<=0&&!modalOpen&&S.sites.filter(s=>s.open).length>=1&&S.total>60){evT=rnd(100,170);randomEvent()}
}
function sparkle(x,y){for(let i=0;i<7;i++)parts.push({x,y,vx:rnd(-50,50),vy:rnd(-70,-10),t:0,c:["#7fd3ff","#fff","#b0f0ff"][i%3]})}

// ---------- layout of units ----------
function unitPos(s,i){const d=def(s.id);const n=s.units.length;
 if(s.id==="fair"){const cols=10,r=Math.floor(i/cols),c=i%cols;return{x:d.x-72+c*16,y:d.y-14+r*17}}
 const cols=Math.min(n,5),r=Math.floor(i/cols),c=i%cols;const rowN=Math.min(cols,n-r*cols);return{x:d.x+(s.id==="constr"?12:0)-(rowN-1)*11+c*22,y:d.y-8+r*24-(n>5?4:0)}}

// ---------- render ----------
const cv=$("#cv"),ctx=cv.getContext("2d");let scale=1,DPR=1;
function resize(){const w=cv.parentElement.clientWidth;const h=Math.min(w*0.95,window.innerHeight*0.5);cv.style.height=h+"px";DPR=window.devicePixelRatio||1;cv.width=w*DPR;cv.height=h*DPR;scale=Math.min(w/W,h/H);}
let offX=0,offY=0;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(t){const w=cv.width/DPR,h=cv.height/DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 // grass
 ctx.fillStyle="#7ccf5e";ctx.fillRect(0,0,w,h);
 offX=(w-W*scale)/2;offY=(h-H*scale)/2;ctx.translate(offX,offY);ctx.scale(scale,scale);
 ctx.fillStyle="#86d866";for(let i=0;i<40;i++){const gx=(i*97)%W,gy=(i*61)%H;ctx.beginPath();ctx.arc(gx,gy,10,0,7);ctx.fill()}
 // trees
 for(const [tx,ty] of [[20,30],[160,40],[370,110],[200,260],[380,380],[30,240],[190,355]]){ctx.fillStyle="#3f9a3a";ctx.beginPath();ctx.arc(tx,ty,13,0,7);ctx.fill();ctx.fillStyle="#58b84c";ctx.beginPath();ctx.arc(tx-3,ty-3,8,0,7);ctx.fill()}
 // roads
 ctx.lineCap="round";ctx.lineJoin="round";
 for(const s of S.sites){const p=pathTo(s);ctx.strokeStyle=s.open?"#5d6470":"#8a9a86";ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>ctx.lineTo(q.x,q.y));ctx.stroke();}
 for(const s of S.sites){if(!s.open)continue;const p=pathTo(s);ctx.strokeStyle="#f3d34a";ctx.lineWidth=1.5;ctx.setLineDash([6,7]);ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>ctx.lineTo(q.x,q.y));ctx.stroke();ctx.setLineDash([])}
 // yard
 ctx.fillStyle="#c8ccd2";rr(YARD.x-50,YARD.y-34,100,60,8);ctx.fill();ctx.strokeStyle="#8b939e";ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle="#2f6fd0";rr(YARD.x-44,YARD.y-30,40,26,4);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 8px sans-serif";ctx.textAlign="center";ctx.fillText("HQ",YARD.x-24,YARD.y-14);
 if(S.wash>0){ctx.fillStyle="#7fd3ff";rr(YARD.x+4,YARD.y-30,20,14,3);ctx.fill();ctx.fillStyle="#035";ctx.font="7px sans-serif";ctx.fillText("WASH",YARD.x+14,YARD.y-20)}
 if(S.dump>0){ctx.fillStyle="#8a6d3b";ctx.beginPath();ctx.arc(YARD.x+38,YARD.y-20,9,0,7);ctx.fill();ctx.font="9px sans-serif";ctx.fillText("💩",YARD.x+38,YARD.y-17)}
 label("YOUR YARD",YARD.x,YARD.y+38,"#1d2433","#fff");
 // sites
 for(const s of S.sites)drawSite(s,t);
 // trucks
 trucks.forEach((tr,i)=>drawTruck(tr,i,t));
 // parts
 for(const p of parts){ctx.globalAlpha=1-p.t/.6;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,7);ctx.fill()}ctx.globalAlpha=1;
 // floats
 ctx.textAlign="center";for(const f of floats){ctx.globalAlpha=1-f.t/1.2;ctx.font="900 13px Trebuchet MS,sans-serif";ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.strokeText(f.txt,f.x,f.y-f.t*30);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-f.t*30)}ctx.globalAlpha=1;
 if(now()<heatUntil){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle="rgba(255,120,0,.12)";ctx.fillRect(0,0,w,h)}
}
function label(txt,x,y,bg,fg,fs=9){ctx.font=`900 ${fs}px Trebuchet MS,sans-serif`;ctx.textAlign="center";const tw=ctx.measureText(txt).width+10;ctx.fillStyle=bg;rr(x-tw/2,y-fs,tw,fs+5,6);ctx.fill();ctx.fillStyle=fg;ctx.fillText(txt,x,y)}
function drawSite(s,t){const d=def(s.id);const bw=s.id==="fair"?176:124,bh=s.id==="fair"?84:66;
 ctx.fillStyle=s.open?d.col:"#a9b5a4";rr(d.x-bw/2,d.y-bh/2-6,bw,bh,10);ctx.fill();ctx.strokeStyle=s.open?"#00000025":"#0002";ctx.lineWidth=2;ctx.stroke();
 if(!s.open){ctx.font="22px sans-serif";ctx.textAlign="center";ctx.fillText("🔒",d.x,d.y+2);label(d.name,d.x,d.y-bh/2-10,"#465063","#fff");label("Unlock "+money(d.cost),d.x,d.y+24,S.cash>=d.cost?"#1f9a40":"#6b7385","#fff",10);return}
 // decor
 ctx.font="16px sans-serif";ctx.textAlign="center";
 if(s.id==="party"){ctx.fillText("🎈",d.x-48,d.y-14);ctx.fillText("🍔",d.x+48,d.y+18)}

function loop(t){const dt=Math.min(.25,(t-last)/1000);last=t;if(S.started)update(dt);draw(t);drawTipped(t);uiT+=dt;saveT+=dt;if(uiT>.2){uiT=0;hud();refreshTab()}if(saveT>5){saveT=0;save()}requestAnimationFrame(loop)}
window.__pt={get S(){return S},update,trucks:()=>trucks,refreshTab,randomEvent,save,offline};
