<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b6fd8">
<title>Potty Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚽</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f2a4a;font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:#1d2433;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#eaf3ff;position:relative;overflow:hidden}
#hud{display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#1b6fd8,#1557ad);color:#fff;box-shadow:0 2px 6px #0004;z-index:3}
#cashwrap{display:flex;align-items:center;gap:6px}
#cashic{font-size:26px}
#cash{font-size:26px;font-weight:900;text-shadow:0 2px 0 #0a3a7a;letter-spacing:.5px;display:inline-block;transform-origin:left center}
#rate{font-size:12px;opacity:.95;font-weight:700}
#hud .sp{flex:1}
.ib{background:#ffffff26;border:0;color:#fff;font-size:17px;width:36px;height:36px;border-radius:10px;cursor:pointer}
#mission{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff8e1;border-bottom:2px solid #ffd36b;z-index:2}
#mission .mi{font-size:20px}
#mission .mt{flex:1;min-width:0}
#mission .mtt{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mission .mbar{height:7px;background:#f1e2b8;border-radius:5px;overflow:hidden;margin-top:3px}
#mission .mbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff7a00);transition:width .3s}
#mclaim{border:0;border-radius:9px;padding:7px 10px;font-weight:900;font-size:12px;color:#fff;background:#b9c4d4;min-width:76px}
#mclaim.ready{background:linear-gradient(#35c25a,#1f9a40);box-shadow:0 3px 0 #13702c;animation:pulse 1s infinite}
#boostbar{display:flex;gap:6px;padding:5px 10px;background:#d6e7ff;align-items:center;font-size:12px}
#boostbtn{flex:1;border:0;border-radius:10px;padding:7px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(#ff9d2e,#f07800);box-shadow:0 3px 0 #b85a00;cursor:pointer}
#boostbtn:disabled{background:#9fb0c8;box-shadow:0 3px 0 #7a8aa3}
#plg{font-weight:800;color:#a67c00;white-space:nowrap}
#mapwrap{position:relative;flex:0 0 auto}
canvas{display:block;width:100%;touch-action:manipulation}
#combo{position:absolute;right:10px;top:8px;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #c2410c,0 0 10px #f97316;opacity:0;pointer-events:none;transition:opacity .2s}
#banner{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;box-shadow:0 3px 10px #0003;display:none;align-items:center;gap:8px}
#tabs{display:flex;background:#1d2433}
#tabs button{flex:1;border:0;background:none;color:#9fb3cf;padding:8px 0 7px;font-size:11px;font-weight:800;cursor:pointer;border-bottom:3px solid transparent;line-height:1.15}
#tabs button b{display:block;font-size:17px}
#tabs button.on{color:#fff;border-bottom-color:#ffb020;background:#ffffff0d}
#tabs button .dot{display:inline-block;width:7px;height:7px;background:#ff4d4d;border-radius:50%;margin-left:2px;vertical-align:top}
#bulk{display:flex;gap:4px;padding:6px 8px 0}
#bulk button{flex:1;border:0;border-radius:8px;padding:6px 0;font-weight:900;font-size:12px;background:#d2deef;color:#4a5874;cursor:pointer}
#bulk button.on{background:#1d2433;color:#ffd23f}
#panel{flex:1;overflow-y:auto;padding:6px 8px 20px;-webkit-overflow-scrolling:touch}
.card{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:7px;box-shadow:0 2px 0 #c7d6ea;transition:transform .15s}
.card.best{box-shadow:0 0 0 2px #35c25a,0 0 14px #35c25a88;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #35c25a,0 0 22px #35c25acc}}
.card .ic{font-size:28px;width:38px;text-align:center}
.card .tx{flex:1;min-width:0}
.card .t{font-weight:800;font-size:14px}
.card .d{font-size:12px;color:#5a6780;margin-top:2px}
.card .lb{height:5px;background:#e3e9f3;border-radius:4px;margin-top:4px;overflow:hidden}
.card .lb i{display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#2563eb)}
.buy{border:0;border-radius:10px;min-width:88px;padding:7px 6px;font-weight:900;font-size:13px;color:#fff;background:linear-gradient(#35c25a,#1f9a40);box-shadow:0 3px 0 #13702c;cursor:pointer;line-height:1.1}
.buy small{display:block;font-size:10px;opacity:.9}
.buy:active{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 #13702c}
.buy:disabled{background:#b9c4d4;box-shadow:0 3px 0 #96a3b6;color:#eef}
.buy.max{background:#8a6cf0;box-shadow:0 3px 0 #5b43b5}
.card.best .buy{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.modal{position:absolute;inset:0;background:#0b1a33cc;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.box{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px #0006;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.box h2{margin:4px 0 8px;font-size:22px}
.box p{margin:6px 0;color:#435069;font-size:14px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(#35c25a,#1f9a40);box-shadow:0 4px 0 #13702c;margin-top:10px;cursor:pointer}
.big.alt{background:linear-gradient(#7d8ca6,#5b6a84);box-shadow:0 4px 0 #3c4860}
.big.red{background:linear-gradient(#ff5a5a,#d42c2c);box-shadow:0 4px 0 #8f1b1b}
.big.orange{background:linear-gradient(#ff9d2e,#f07800);box-shadow:0 4px 0 #b85a00}
.big:active{transform:translateY(2px)}
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#4fa3ff,#1557ad 60%,#0b2f63);color:#fff;text-align:center;padding:24px}
#title .logo{font-size:54px;font-weight:900;line-height:.95;letter-spacing:2px;text-shadow:0 5px 0 #0a3a7a,0 8px 18px #0008;transform:rotate(-4deg)}
#title .logo span{color:#ffd23f}
#title .em{font-size:84px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
#title .tag{margin:14px 0 26px;font-size:16px;opacity:.9}
#title .big{max-width:260px;font-size:22px;animation:pulse 1.2s infinite}
.mini{font-size:52px;font-weight:900;margin:6px 0}
.tbar{height:10px;background:#e3e9f3;border-radius:6px;overflow:hidden;margin:8px 0}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9d2e,#ff4d4d);width:100%}
#toast{position:absolute;left:50%;bottom:46%;transform:translateX(-50%);background:#1d2433ee;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:19;max-width:92%;text-align:center}
.sec{font-size:11px;font-weight:900;color:#6c7a93;margin:8px 4px 5px;letter-spacing:1px}
.coin{position:absolute;z-index:15;font-size:18px;pointer-events:none;left:0;top:0}
.streak{display:flex;gap:4px;justify-content:center;margin:10px 0}
.streak span{width:38px;height:46px;border-radius:9px;background:#e3e9f3;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6c7a93}
.streak span.got{background:linear-gradient(#ffd23f,#ffb020);color:#5a3a00}
.streak span.today{outline:3px solid #35c25a;animation:pulse 1s infinite}
.ach{opacity:.45;filter:grayscale(1)}
</style></head>
<body><div id="app">
<div id="hud"><div><div id="cashwrap"><span id="cashic">💰</span><span id="cash">$0</span></div><div id="rate">$0/s</div></div><div class="sp"></div>
<button class="ib" id="sndbtn" title="Sound">🔊</button><button class="ib" id="setbtn" title="Settings">⚙️</button></div>
<div id="mission"><div class="mi">🎯</div><div class="mt"><div class="mtt" id="mtt">Mission</div><div class="mbar"><i id="mbar"></i></div></div><button id="mclaim">—</button></div>
<div id="boostbar"><button id="boostbtn">📺 2x cash 60s (Demo boost)</button><span id="plg"></span></div>
<div id="mapwrap"><canvas id="cv"></canvas><div id="combo"></div><div id="banner"></div></div>
<div id="tabs"><button data-t="units" class="on"><b>🚽</b>Sites</button><button data-t="trucks"><b>🚛</b>Trucks</button><button data-t="crew"><b>🧑‍🔧</b>Crew</button><button data-t="yard"><b>🏗️</b>Yard</button><button data-t="awards"><b>🏆</b>Awards</button><button data-t="prestige"><b>🪠</b>Sell</button></div>
<div id="bulk"><button data-b="1" class="on">x1</button><button data-b="10">x10</button><button data-b="100">x100</button><button data-b="max">MAX</button></div>
<div id="panel"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="title"><div class="em">🚽</div><div class="logo">POTTY<br><span>TYCOON</span></div><div class="tag">Build the #1 porta-potty empire in the county.<br>It's a dirty job. Somebody's gotta get rich doing it.</div><button class="big" id="playbtn">▶ PLAY</button></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){if(!isFinite(n))return"∞";if(n<1000)return (n<10&&n%1?n.toFixed(1):Math.floor(n)).toString();let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+SUF[i]}
const money=n=>"$"+fmt(n);
const rnd=(a,b)=>a+Math.random()*(b-a);
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`}
const now=()=>Date.now();
const today=()=>new Date().toISOString().slice(0,10);

// ---------- data ----------
const W=400,H=400;
const YARD={x:66,y:336};
const SITES=[
 {id:"party",name:"Backyard Party",em:"🎉",x:300,y:330,cost:0,base:2,grow:[10,25,50],rent:1,fill:20,lvCost:8,col:"#9be37a",mgr:10},
 {id:"remodel",name:"Home Remodel",em:"🏠",x:318,y:196,cost:1200,base:3,grow:[10,25,50],rent:8,fill:24,lvCost:500,col:"#c9e6a5",mgr:150},
 {id:"constr",name:"Construction Site",em:"🏗️",x:104,y:168,cost:30000,base:4,grow:[10,25,50],rent:90,fill:28,lvCost:12000,col:"#e8d3a6",mgr:2000},
 {id:"fair",name:"County Fair",em:"🎡",x:262,y:62,cost:3000000,base:30,grow:[],rent:3000,fill:16,lvCost:600000,col:"#ffd6e8",mgr:30000}
];
const STAGE_N=["Foundation","Framing","Building","Skyscraper"];
const TIERS=[{n:"Basic",m:1,c:0,em:"🚽"},{n:"Deluxe",m:3,c:5000,em:"🧼"},{n:"ADA Accessible",m:10,c:250000,em:"♿"},{n:"Luxury Trailer",m:40,c:2.5e7,em:"✨"}];
const FAIR_LEN=120,FAIR_CD=120;
const LVR=1.18;

let S;
function fresh(){return{cash:0,total:0,runTotal:0,plungers:0,tier:0,tank:0,speed:0,wash:0,dump:0,cap:0,trucks:1,
 sites:SITES.map(s=>({id:s.id,open:s.id==="party",mgr:false,lv:1,units:Array.from({length:s.base},()=>Math.random()*.3)})),
 fairUntil:0,fairReady:0,boostUntil:0,boostCD:0,msUntil:0,sound:true,last:Date.now(),started:false,sold:0,
 taps:0,flushes:0,fairs:0,events:0,maxCombo:0,mission:0,ach:[],msDone:0,lastDay:"",streak:0,bulk:"1"}}
function load(){try{const d=JSON.parse(localStorage.getItem("pottyTycoon_v2"));if(d&&d.sites){S=Object.assign(fresh(),d);return true}}catch(e){}S=fresh();return false}
function save(){S.last=Date.now();try{localStorage.setItem("pottyTycoon_v2",JSON.stringify(S))}catch(e){}}

const site=id=>S.sites.find(s=>s.id===id);
const def=id=>SITES.find(s=>s.id===id);
function boostMult(){return (now()<S.boostUntil?2:1)*(now()<S.msUntil?2:1)}
function mult(){return TIERS[S.tier].m*(1+S.plungers*0.25)*boostMult()}
function lvMult(lv){return lv*Math.pow(2,Math.floor(lv/25))}
function unitRent(s){return def(s.id).rent*lvMult(s.lv)*mult()}
function feeOf(s){return unitRent(s)*def(s.id).fill*.4}
function targetUnits(s){const d=def(s.id);return d.base+d.grow.filter(g=>s.lv>=g).length*(s.id==="constr"?2:2)}
function stage(s){return Math.min(3,def(s.id).grow.filter(g=>s.lv>=g).length)}
const tankSize=()=>3+S.tank;
const truckSpeed=()=>75*(1+S.speed*0.12);
const serviceTime=()=>0.8/(1+S.wash*0.2);
const dumpTime=()=>2.2/(1+S.dump*0.25);
const maxTrucks=()=>2+S.cap;
let heatUntil=0;
const stinkMul=()=>now()<heatUntil?2:1;
const fairActive=()=>now()<S.fairUntil;
const siteActive=s=>s.open&&(s.id!=="fair"||fairActive());
function rentRate(){let r=0;for(const s of S.sites)if(siteActive(s))r+=unitRent(s)*s.units.filter(u=>u<1).length;return r}
function idealRate(){let r=0;for(const s of S.sites)if(s.open&&s.id!=="fair")r+=unitRent(s)*s.units.length;return r}

// ---------- leveled upgrades & bulk ----------
const LV={
 tank:{base:30,r:1.45,get:()=>S.tank,add:n=>S.tank+=n},
 speed:{base:20,r:1.4,get:()=>S.speed,add:n=>S.speed+=n},
 wash:{base:150,r:1.5,get:()=>S.wash,add:n=>S.wash+=n},
 dump:{base:120,r:1.5,get:()=>S.dump,add:n=>S.dump+=n}
};
for(const s of SITES)LV["site_"+s.id]={base:s.lvCost,r:LVR,get:()=>site(s.id).lv-1,add:n=>{const st=site(s.id);const before=st.lv;st.lv+=n;onSiteLevel(st,before)}};
function bulkCost(k,n){const u=LV[k],L=u.get();return u.base*Math.pow(u.r,L)*(Math.pow(u.r,n)-1)/(u.r-1)}
function bulkN(k){if(S.bulk!=="max")return +S.bulk;const u=LV[k],L=u.get();const c0=u.base*Math.pow(u.r,L);const n=Math.floor(Math.log(S.cash*(u.r-1)/c0+1)/Math.log(u.r));return Math.max(1,n)}
const C={truck:()=>Math.floor(80*Math.pow(4,S.trucks-1)),cap:()=>Math.floor(800*Math.pow(6,S.cap)),tier:()=>TIERS[S.tier+1]?TIERS[S.tier+1].c:Infinity};
function spend(c){if(S.cash>=c){S.cash-=c;return true}return false}

// ---------- audio ----------
let AC=null;
function tone(f,d=.08,type="square",vol=.05,slide=0,delay=0){if(!S||!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
let lastCoinSnd=0;
const sfx={
 coin:(p=0)=>{if(performance.now()-lastCoinSnd<45)return;lastCoinSnd=performance.now();const b=880*Math.pow(1.06,Math.min(p,12));tone(b,.05,"square",.035);tone(b*1.5,.09,"square",.035,0,.05)},
 buy:()=>{tone(523,.07);tone(659,.07,"square",.05,0,.06);tone(784,.12,"square",.05,0,.12)},
 flush:()=>{tone(700,.4,"sawtooth",.03,-600);tone(300,.3,"triangle",.04,-200,.05)},
 bad:()=>tone(180,.25,"sawtooth",.05,-80),
 tap:()=>tone(700,.04,"triangle",.06),
 scrub:(c)=>tone(500+c*40,.05,"triangle",.07,200),
 horn:()=>{tone(392,.12,"square",.05);tone(392,.18,"square",.05,0,.15)},
 fanfare:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,"triangle",.07,0,i*.09)),
 level:()=>[660,880,1100].forEach((f,i)=>tone(f,.1,"square",.04,0,i*.05))
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

// ---------- trucks ----------
let trucks=[];
function syncTrucks(){while(trucks.length<S.trucks)trucks.push({x:YARD.x,y:YARD.y,st:"idle",path:[],target:null,load:0,t:0,dir:1});}
function pathTo(s){const d=def(s.id);return[{x:YARD.x,y:YARD.y},{x:YARD.x,y:d.y+24},{x:d.x,y:d.y+24}]}
function dispatch(tr,s){tr.target=s.id;tr.st="go";tr.path=pathTo(s).slice(1);}
function goHome(tr){const d=def(tr.target);tr.st="home";tr.path=[{x:YARD.x,y:d.y+24},{x:YARD.x,y:YARD.y}];}
function enRoute(id){return trucks.some(t=>t.target===id&&(t.st==="go"||t.st==="svc"))}
function dirtiest(s){let b=-1,v=.08;s.units.forEach((u,i)=>{if(u>v){v=u;b=i}});return b}

// ---------- fx ----------
let floats=[],parts=[],walkers=[],clouds=[];
for(let i=0;i<4;i++)clouds.push({x:rnd(0,W),y:rnd(20,360),s:rnd(.7,1.4),v:rnd(4,9)});
function float(x,y,txt,col="#1f9a40",big=false){floats.push({x,y,txt,col,t:0,big})}
function sparkle(x,y,n=8,cols=["#7fd3ff","#fff","#b0f0ff"]){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-60,60),vy:rnd(-90,-10),t:0,life:.6,c:cols[i%cols.length],g:120,r:2.2})}
function confetti(x,y,n=60){const cols=["#ff4d6d","#ffd23f","#35c25a","#3b82f6","#a855f7","#fff"];for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-220,-40),t:0,life:1.6,c:cols[i%6],g:260,r:3,rect:true,rot:rnd(0,6)})}
function flushFx(x,y){for(let i=0;i<16;i++){const a=rnd(0,Math.PI*2);parts.push({x,y,vx:Math.cos(a)*rnd(20,70),vy:Math.sin(a)*rnd(20,70)-40,t:0,life:.8,c:i%2?"#38bdf8":"#bae6fd",g:150,r:2.6})}float(x,y-14,"FLUSH! 🌀","#0284c7")}
function shake(p=6){$("#app").animate([{transform:"translate(0,0)"},{transform:`translate(${-p}px,${p/2}px)`},{transform:`translate(${p}px,${-p/2}px)`},{transform:`translate(${-p/2}px,${p/2}px)`},{transform:"translate(0,0)"}],{duration:300})}
let coinCount=0;
function flyCoin(mx,my){if(coinCount>14)return;coinCount++;const cr=cv.getBoundingClientRect(),ar=$("#app").getBoundingClientRect(),tr=$("#cashic").getBoundingClientRect();
 const sx=cr.left-ar.left+offX+mx*scale,sy=cr.top-ar.top+offY+my*scale,tx=tr.left-ar.left,ty=tr.top-ar.top;
 const e=document.createElement("div");e.className="coin";e.textContent="🪙";$("#app").appendChild(e);
 const midx=(sx+tx)/2+rnd(-60,60),midy=Math.min(sy,ty)+rnd(-40,40);
 const a=e.animate([{transform:`translate(${sx}px,${sy}px) scale(.6)`},{transform:`translate(${midx}px,${midy}px) scale(1.2)`,offset:.45},{transform:`translate(${tx}px,${ty}px) scale(.8)`}],{duration:650+rnd(0,200),easing:"cubic-bezier(.5,0,.7,1)"});
 a.onfinish=()=>{e.remove();coinCount--;punchCash()}}
let punchT=0;function punchCash(){punchT=1}

// ---------- earn ----------
let earnLog=[];
function earn(n,x,y,coin=true,col){S.cash+=n;S.total+=n;S.runTotal+=n;earnLog.push([now(),n]);if(x!=null){float(x,y,"+"+money(n),col);if(coin)flyCoin(x,y)}}
function serviceUnit(s,i,x,y){const full=s.units[i]>=1;const pay=feeOf(s)*(full?.5:Math.max(.1,s.units[i]));s.units[i]=0;S.flushes++;earn(pay,x,y-10);sfx.coin(2);checkMilestone()}

// ---------- combo & tap ----------
let combo=0,comboT=0;
function comboMult(){return 1+Math.min(combo,20)*0.1}
function tapValue(){return Math.max(1,idealRate()*0.04+1)}

 function finish(ok){done=true;clearInterval(iv);const m=ok?win():lose();if(ok){sfx.fanfare();confetti(200,150,90)}else{sfx.bad();shake(8)}modal(`<div style="font-size:48px">${ok?"🏆":"💩"}</div><h2>${ok?"Nice!":"Oof."}</h2><p>${m}</p><button class="big" id="ok">Back to work</button>`);$("#ok").onclick=closeModal}}

// ---------- prestige ----------
function sellCompany(){const g=plungersFor();if(g<=0||!site("fair").open)return;

// ---------- offline & daily ----------
function offline(after){const away=Math.min(8*3600,(now()-S.last)/1000);if(away<30){after&&after();return}let r=0;for(const s of S.sites){if(!s.mgr||!s.open||s.id==="fair")continue;r+=def(s.id).rent*lvMult(s.lv)*s.units.length}
 r*=TIERS[S.tier].m*(1+S.plungers*.25)*0.25;const got=r*away;
 for(const s of S.sites)if(s.open&&s.id!=="fair")s.units=s.units.map(u=>s.mgr?Math.random()*.4:1);
 if(got<1){if(away>60)setTimeout(()=>toast("Units filled up while you were gone. Hire drivers to earn offline!"),800);after&&after();return}
 modal(`<div style="font-size:48px">🌙🚛</div><h2>Welcome back!</h2><p>While you were away (${fmtTime(away)}) your drivers earned</p><div class="mini" style="color:#1f9a40">${money(got)}</div><button class="big orange" id="dbl">📺 Double it! ${money(got*2)} <small>(Demo ad)</small></button><button class="big" id="ok">Collect</button>`);
 $("#ok").onclick=()=>{closeModal();earn(got);confetti(200,80,50);sfx.coin();after&&after()};
 $("#dbl").onclick=()=>fakeAd(()=>{earn(got*2);confetti(200,80,120);shake(6);sfx.fanfare();toast(`💰 Doubled! +${money(got*2)}`);after&&after()})}
function daily(){const d=today();if(S.lastDay===d)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=d;
 const day=((S.streak-1)%7)+1;const reward=Math.floor((50+idealRate()*30)*day);
 let row="";for(let i=1;i<=7;i++)row+=`<span class="${i<day?"got":""} ${i===day?"today":""}">D${i}<b>${i===7?"🎁":"💵"}</b></span>`;
 modal(`<div style="font-size:44px">📅🔥</div><h2>Daily Bonus · Day ${S.streak}</h2><p>Log in every day for bigger rewards!</p><div class="streak">${row}</div><div class="mini" style="color:#1f9a40;font-size:38px">${money(reward)}</div><button class="big" id="ok">Claim</button>`);
 $("#ok").onclick=()=>{closeModal();earn(reward);confetti(200,80,80);sfx.fanfare();checkAch();save()}}

const had=load();syncTrucks();resize();window.addEventListener("resize",resize);shownCash=S.cash;

 if(had)offline(daily);else{S.lastDay=today();S.streak=1;modal(`<div style="font-size:48px">🚽🚛</div><h2>Welcome, boss!</h2><p>You've got <b>1 truck</b> and <b>2 porta-potties</b> at a backyard party.</p><p><b>👆 Tap the party</b> to scrub units for cash. Tap fast for a <b>🔥 combo</b>!</p><p>Level up sites, unlock new ones, and follow the 🎯 missions up top.</p><button class="big" id="ok">Let's roll!</button>`);$("#ok").onclick=closeModal}save()};
if(had)$("#playbtn").textContent="▶ CONTINUE";
refreshTab(true);hudSlow();requestAnimationFrame(loop);
